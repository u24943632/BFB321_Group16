<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reorder · Simply Garlic Tracker</title>
  <meta name="description" content="EOQ, safety stock and reorder point recommendations per product.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="sg-nav"></header>

  <main id="main" class="container-xxl" tabindex="-1">
    <div class="sg-page-header">
      <h1>Reorder recommendations</h1>
      <p>Economic order quantity, safety stock and reorder point per product, calculated by <code>models/eoq.py</code>.</p>
    </div>

    <section class="card mb-4" aria-labelledby="plan-heading">
      <div class="card-header d-flex flex-wrap justify-content-between gap-2">
        <h2 id="plan-heading" class="h3 mb-0">Per product</h2>
        <span class="small text-muted">95% service level, 250 working days</span>
      </div>
      <div class="card-body" id="plan-table"></div>
    </section>

    <section class="card" aria-labelledby="calc-heading">
      <div class="card-header"><h2 id="calc-heading" class="h3 mb-0">What-if calculator</h2></div>
      <div class="card-body">
        <form id="calc-form" novalidate class="row g-3">
          <div class="col-6 col-md-4 col-xl-2">
            <label class="form-label required" for="c-demand">Annual demand</label>
            <input class="form-control" id="c-demand" type="number" min="1" step="any" required value="1000" aria-describedby="c-demand-help c-demand-error">
            <div class="form-text" id="c-demand-help">Boxes per year</div>
            <div class="invalid-feedback" id="c-demand-error"></div>
          </div>
          <div class="col-6 col-md-4 col-xl-2">
            <label class="form-label required" for="c-order">Order cost (R)</label>
            <input class="form-control" id="c-order" type="number" min="0.01" step="any" required value="100" aria-describedby="c-order-help c-order-error">
            <div class="form-text" id="c-order-help">Per order / production run</div>
            <div class="invalid-feedback" id="c-order-error"></div>
          </div>
          <div class="col-6 col-md-4 col-xl-2">
            <label class="form-label required" for="c-hold">Holding cost (R)</label>
            <input class="form-control" id="c-hold" type="number" min="0.01" step="any" required value="5" aria-describedby="c-hold-help c-hold-error">
            <div class="form-text" id="c-hold-help">Per box per year</div>
            <div class="invalid-feedback" id="c-hold-error"></div>
          </div>
          <div class="col-6 col-md-4 col-xl-2">
            <label class="form-label required" for="c-sd">Daily demand std dev</label>
            <input class="form-control" id="c-sd" type="number" min="0" step="any" required value="10" aria-describedby="c-sd-help c-sd-error">
            <div class="form-text" id="c-sd-help">Boxes</div>
            <div class="invalid-feedback" id="c-sd-error"></div>
          </div>
          <div class="col-6 col-md-4 col-xl-2">
            <label class="form-label required" for="c-lead">Lead time</label>
            <input class="form-control" id="c-lead" type="number" min="0.1" step="any" required value="4" aria-describedby="c-lead-help c-lead-error">
            <div class="form-text" id="c-lead-help">Days</div>
            <div class="invalid-feedback" id="c-lead-error"></div>
          </div>
          <div class="col-6 col-md-4 col-xl-2">
            <label class="form-label" for="c-service">Service level</label>
            <select class="form-select" id="c-service">
              <option value="1.2816">90%</option>
              <option value="1.6449" selected>95%</option>
              <option value="1.96">97.5%</option>
              <option value="2.3263">99%</option>
            </select>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit"><i class="bi bi-calculator" aria-hidden="true"></i> Calculate</button>
          </div>
        </form>
        <div id="calc-result" class="row g-3 mt-2" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <noscript><div class="container alert alert-warning mt-3">This tracker needs JavaScript enabled.</div></noscript>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/pages/reorder.js"></script>
</body>
</html>
