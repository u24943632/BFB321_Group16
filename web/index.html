<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Simply Garlic Tracker</title>
  <meta name="description" content="Live box status, stage dwell alerts and exceptions for the Simply Garlic warehouse.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="sg-nav"></header>

  <main id="main" class="container-xxl" tabindex="-1">
    <div class="sg-page-header d-flex flex-wrap justify-content-between align-items-end gap-2">
      <div>
        <h1>Operations overview</h1>
        <p>Every box, its stage and how long it has been there. <span id="as-of"></span></p>
      </div>
      <a class="btn btn-primary" href="scan.html"><i class="bi bi-qr-code-scan" aria-hidden="true"></i> Scan a box</a>
    </div>

    <section aria-labelledby="summary-heading" class="mb-4">
      <h2 id="summary-heading" class="visually-hidden">Summary</h2>
      <div class="row g-3" id="kpi-cards"></div>
    </section>

    <section aria-labelledby="pipeline-heading" class="mb-4">
      <h2 id="pipeline-heading" class="h3 mb-3">Stage pipeline</h2>
      <div class="sg-pipeline" id="pipeline"></div>
    </section>

    <div class="row g-4">
      <div class="col-lg-6">
        <section class="card h-100" aria-labelledby="inv-heading">
          <div class="card-header"><h2 id="inv-heading" class="h3 mb-0">Open investigations</h2></div>
          <ul class="list-group list-group-flush" id="investigations"></ul>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="card h-100" aria-labelledby="reorder-heading">
          <div class="card-header"><h2 id="reorder-heading" class="h3 mb-0">Items to reorder</h2></div>
          <ul class="list-group list-group-flush" id="reorder-list"></ul>
          <div class="card-footer bg-transparent"><a href="reorder.html">All reorder recommendations</a></div>
        </section>
      </div>
    </div>
  </main>

  <noscript><div class="container alert alert-warning mt-3">This tracker needs JavaScript enabled.</div></noscript>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
